name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x', '1.26.x', '1.27.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6.2.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true

      - name: Test all modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r modfile; do
            moddir="$(dirname "$modfile")"
            echo "== testing $moddir =="
            (
              cd "$moddir"
              go test ./...
            )
          done < <(printf '%s\n' go.mod && git ls-files '**/go.mod')

      - name: Race all modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r modfile; do
            moddir="$(dirname "$modfile")"
            echo "== racing $moddir =="
            (
              cd "$moddir"
              go test -race ./...
            )
          done < <(printf '%s\n' go.mod && git ls-files '**/go.mod')

      - name: Vet all modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r modfile; do
            moddir="$(dirname "$modfile")"
            echo "== vet $moddir =="
            (
              cd "$moddir"
              go vet ./...
            )
          done < <(printf '%s\n' go.mod && git ls-files '**/go.mod')

      - name: Check gofmt
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l . 2>/dev/null)"
          if [ -n "$unformatted" ]; then
            echo "gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi
