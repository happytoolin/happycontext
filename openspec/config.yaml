schema: spec-driven

context: |
  happycontext is a Go library that emits one canonical structured event per
  request. Multi-module repo: root module + adapter/{slog,zap,zerolog} +
  integration/{std,gin,echo,fiber,fiberv3,worker} + benches + cmd/examples,
  released in lockstep via release-please.
  Conventional commits; breaking markers drive release-please major bumps.
  The authoritative v2 design is V2_DESIGN.md at repo root (21 amendments,
  decisions ledger, gates). Go floor 1.25; CI matrix 1.25/1.26/1.27.
  The v2 architecture develops on the `v2` branch and publishes as v1.0.0
  (v2 is the codename).

rules:
  proposal:
    - Keep proposals under 400 words; link to V2_DESIGN.md instead of restating it
    - Always include a "Non-goals" section
  tasks:
    - Every task maps to a concrete PR; state the PR's target branch and stack parent
    - Keep stacks shallow — at most 4 stacked PRs per change
    - Each PR task list must include its verification step (tests, race, benchstat gate)
