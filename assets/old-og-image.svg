    <text x="18" y="92" fill="#F60" fill-opacity="0.92" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="15">hc.Add(ctx, "user_id", "u_8472")
      <set attributeName="opacity" to="0" begin="0s" dur="0.001s" fill="freeze" />
      <animate attributeName="opacity" values="0;1" dur="0.22s" begin="0.45s" fill="freeze" />
    </text>
    <text x="18" y="122" fill="#F60" fill-opacity="0.92" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="15">hc.Add(ctx, "feature", "checkout")
