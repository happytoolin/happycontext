    <text x="18" y="182" fill="#F60" fill-opacity="0.82" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="15">w.WriteHeader(http.StatusOK)
      <set attributeName="opacity" to="0" begin="0s" dur="0.001s" fill="freeze" />
      <animate attributeName="opacity" values="0;1" dur="0.22s" begin="1.2s" fill="freeze" />
    </text>
    <g>
      <set attributeName="opacity" to="0" begin="0s" dur="0.001s" fill="freeze" />
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.65s" fill="freeze" />
      <rect x="12" y="206" width="476" height="124" rx="8" fill="#F60" fill-opacity="0.08" stroke="#F60" stroke-opacity="0.3" />
      <text x="20" y="224" fill="#F60" fill-opacity="0.9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14">output.json</text>
      <text x="20" y="244" fill="#F60" fill-opacity="0.88" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14">{</text>
      <text x="30" y="262" fill="#F60" fill-opacity="0.88" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14">"level": "INFO", "msg": "request_completed",</text>
      <text x="30" y="280" fill="#F60" fill-opacity="0.88" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14">"http": { "status": 200, "route": "/orders/{id}" },</text>
      <text x="30" y="298" fill="#F60" fill-opacity="0.88" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14">"user": { "id": "u_8472", "feature": "checkout" }</text>
      <text x="20" y="316" fill="#F60" fill-opacity="0.88" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14">}</text>
