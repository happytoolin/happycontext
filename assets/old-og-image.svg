    <text x="18" y="62" fill="#F60" fill-opacity="0.92" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="15">ctx := r.Context()
      <set attributeName="opacity" to="0" begin="0s" dur="0.001s" fill="freeze" />
