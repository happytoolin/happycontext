<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sampler chain</title>
  <desc id="desc">Rule evaluation decides whether an event is written or dropped.</desc>
  <rect width="1200" height="520" fill="#0A0C10"/>

  <text x="60" y="78" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F6F8">Sampler Chain</text>
  <text x="60" y="108" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8B94A1">Rule evaluation decides whether an event is written.</text>

  <rect x="60" y="170" width="200" height="230" rx="14" fill="#10151C" stroke="#1B222B"/>
  <text x="84" y="208" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#6F7885">INPUT</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14" fill="#E6EBF1">
    <text x="84" y="272">request</text>
    <text x="84" y="310">context</text>
  </g>

  <path d="M270 285h42" stroke="#7CFFB2" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M304 279l8 6-8 6" fill="none" stroke="#7CFFB2" stroke-opacity="0.8" stroke-width="1.5"/>

  <rect x="330" y="170" width="540" height="230" rx="14" fill="#10151C" stroke="#1B222B"/>
  <text x="354" y="208" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#6F7885">CHAIN RULES</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="13">
    <text x="354" y="256" fill="#C5CDD8">1  has_error == true</text><text x="654" y="256" fill="#5B6472">→</text><text x="686" y="256" fill="#7CFFB2">keep</text>
    <text x="354" y="302" fill="#C5CDD8">2  path == "/admin"</text><text x="654" y="302" fill="#5B6472">→</text><text x="686" y="302" fill="#7CFFB2">keep</text>
    <text x="354" y="348" fill="#C5CDD8">3  rate(5%)</text><text x="654" y="348" fill="#5B6472">→</text><text x="686" y="348" fill="#7CFFB2">keep</text><text x="736" y="348" fill="#5B6472">/</text><text x="754" y="348" fill="#E06C75">drop</text>
  </g>

  <path d="M878 285h34" stroke="#7CFFB2" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M904 279l8 6-8 6" fill="none" stroke="#7CFFB2" stroke-opacity="0.8" stroke-width="1.5"/>

  <rect x="920" y="170" width="220" height="230" rx="14" fill="#10151C" stroke="#1B222B"/>
  <text x="944" y="208" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#6F7885">DECISION</text>
  <text x="944" y="268" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7CFFB2">KEEP</text>
  <text x="944" y="290" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8B94A1">write structured event</text>
  <text x="944" y="342" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#E06C75">DROP</text>
  <text x="944" y="364" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8B94A1">skip event write</text>
</svg>
