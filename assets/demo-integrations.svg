<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Integrations</title>
  <desc id="desc">Framework integrations feed one core; adapters write to slog, zap, and zerolog.</desc>
  <rect width="1200" height="520" fill="#0A0C10"/>

  <text x="60" y="78" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F6F8">Integrations</text>
  <text x="60" y="108" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8B94A1">Frameworks in, your loggers out.</text>

  <rect x="60" y="150" width="280" height="300" rx="14" fill="#10151C" stroke="#1B222B"/>
  <text x="84" y="190" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#6F7885">FRAMEWORKS</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14" fill="#E6EBF1">
    <circle cx="78" cy="236" r="3" fill="#2A323C"/><text x="94" y="240">net/http</text>
    <circle cx="78" cy="282" r="3" fill="#2A323C"/><text x="94" y="286">gin</text>
    <circle cx="78" cy="328" r="3" fill="#2A323C"/><text x="94" y="332">echo</text>
    <circle cx="78" cy="374" r="3" fill="#2A323C"/><text x="94" y="378">fiber v2/v3</text>
  </g>

  <path d="M342 300C390 300 392 255 428 255" stroke="#7CFFB2" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="430" cy="255" r="3" fill="#7CFFB2"/>
  <path d="M772 255C808 255 810 300 858 300" stroke="#7CFFB2" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="770" cy="255" r="3" fill="#7CFFB2"/>

  <rect x="430" y="180" width="340" height="150" rx="14" fill="#7CFFB2"/>
  <text x="600" y="248" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0A0C10">unolog</text>
  <text x="600" y="284" text-anchor="middle" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#0A0C10" fill-opacity="0.62">core context + sampling</text>

  <rect x="860" y="150" width="280" height="300" rx="14" fill="#10151C" stroke="#1B222B"/>
  <text x="884" y="190" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#6F7885">ADAPTERS</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="14" fill="#E6EBF1">
    <circle cx="878" cy="236" r="3" fill="#2A323C"/><text x="894" y="240">slog</text>
    <circle cx="878" cy="282" r="3" fill="#2A323C"/><text x="894" y="286">zap</text>
    <circle cx="878" cy="328" r="3" fill="#2A323C"/><text x="894" y="332">zerolog</text>
  </g>
</svg>
