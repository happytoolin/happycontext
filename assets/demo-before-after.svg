<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Before vs after</title>
  <desc id="desc">Fragmented log lines versus one structured unolog record.</desc>
  <rect width="1200" height="560" fill="#0A0C10"/>

  <text x="60" y="78" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F6F8">Before vs After</text>
  <text x="60" y="108" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8B94A1">From fragmented lines to one complete event.</text>

  <rect x="60" y="160" width="500" height="320" rx="14" fill="#10151C" stroke="#1B222B"/>
  <text x="84" y="198" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#6F7885">BEFORE · FRAGMENTED</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="13">
    <text x="84" y="240" fill="#61AFEF">INFO</text><text x="150" y="240" fill="#C5CDD8">start path=/api/v1/user</text>
    <text x="84" y="272" fill="#56B6C2">DEBUG</text><text x="150" y="272" fill="#C5CDD8">validate_auth user_id=123</text>
    <text x="84" y="304" fill="#E5C07B">WARN</text><text x="150" y="304" fill="#C5CDD8">cache miss key=u:123</text>
    <text x="84" y="336" fill="#61AFEF">INFO</text><text x="150" y="336" fill="#C5CDD8">db query duration=12ms</text>
    <text x="84" y="368" fill="#E06C75">ERROR</text><text x="150" y="368" fill="#C5CDD8">payment failed code=402</text>
    <text x="84" y="400" fill="#61AFEF">INFO</text><text x="150" y="400" fill="#C5CDD8">request done status=500</text>
  </g>
  <text x="60" y="520" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6F7885">Hard to correlate one request across many lines.</text>

  <path d="M576 320h44" stroke="#7CFFB2" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M612 314l8 6-8 6" fill="none" stroke="#7CFFB2" stroke-opacity="0.8" stroke-width="1.5"/>

  <rect x="640" y="160" width="500" height="320" rx="14" fill="#10151C" stroke="#1B222B"/>
  <text x="664" y="198" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#7CFFB2">AFTER · STRUCTURED</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="12.5">
    <text x="664" y="228" fill="#5B6472">{</text>
    <text x="680" y="255" fill="#8B94A1">"level":</text><text x="810" y="255" fill="#E06C75">"ERROR",</text>
    <text x="680" y="282" fill="#8B94A1">"msg":</text><text x="810" y="282" fill="#E6EBF1">"request_completed",</text>
    <text x="680" y="309" fill="#8B94A1">"http.path":</text><text x="810" y="309" fill="#E6EBF1">"/api/v1/user",</text>
    <text x="680" y="336" fill="#8B94A1">"user_id":</text><text x="810" y="336" fill="#E6EBF1">"123",</text>
    <text x="680" y="363" fill="#8B94A1">"error.message":</text><text x="810" y="363" fill="#E6EBF1">"payment_failed",</text>
    <text x="680" y="390" fill="#8B94A1">"error.type":</text><text x="810" y="390" fill="#E6EBF1">"*errors.errorString",</text>
    <text x="680" y="417" fill="#8B94A1">"http.status":</text><text x="810" y="417" fill="#7CFFB2">500</text><text x="798" y="417" fill="#5B6472">,</text>
    <text x="680" y="444" fill="#8B94A1">"dur_ms":</text><text x="810" y="444" fill="#7CFFB2">45</text>
    <text x="664" y="471" fill="#5B6472">}</text>
  </g>
  <text x="640" y="520" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6F7885">One complete, queryable record.</text>
</svg>
