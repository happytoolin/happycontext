<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Request lifecycle</title>
  <desc id="desc">Start, enrich, finalize, write: one request through one event context.</desc>
  <rect width="1200" height="520" fill="#0A0C10"/>

  <text x="60" y="78" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F6F8">Request Lifecycle</text>
  <text x="60" y="108" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8B94A1">A single request moves through one event context.</text>

  <rect x="60" y="150" width="200" height="310" rx="14" fill="#10151C" stroke="#1B222B"/>
  <text x="76" y="184" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4"><tspan fill="#7CFFB2">01</tspan><tspan fill="#E6EBF1"> START</tspan></text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="11" fill="#C5CDD8">
    <text x="76" y="224">ctx, ev := unolog.New()</text>
    <text x="76" y="252">unolog.Add("method", ...)</text>
    <text x="76" y="280">unolog.Add("route", ...)</text>
    <text x="76" y="308">unolog.Add("req_id", ...)</text>
  </g>

  <path d="M272 305h42" stroke="#7CFFB2" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M306 299l8 6-8 6" fill="none" stroke="#7CFFB2" stroke-opacity="0.8" stroke-width="1.5"/>

  <rect x="340" y="150" width="200" height="310" rx="14" fill="#10151C" stroke="#1B222B"/>
  <text x="356" y="184" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4"><tspan fill="#7CFFB2">02</tspan><tspan fill="#E6EBF1"> ENRICH</tspan></text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="11" fill="#C5CDD8">
    <text x="356" y="224">unolog.Add("user_id", ...)</text>
    <text x="356" y="252">unolog.Add(ctx, ...)</text>
    <text x="356" y="280">unolog.Error(err)</text>
    <text x="356" y="308">unolog.Warn(warn)</text>
  </g>

  <path d="M552 305h42" stroke="#7CFFB2" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M586 299l8 6-8 6" fill="none" stroke="#7CFFB2" stroke-opacity="0.8" stroke-width="1.5"/>

  <rect x="620" y="150" width="200" height="310" rx="14" fill="#10151C" stroke="#1B222B"/>
  <text x="636" y="184" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4"><tspan fill="#7CFFB2">03</tspan><tspan fill="#E6EBF1"> FINALIZE</tspan></text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="11" fill="#C5CDD8">
    <text x="636" y="224">unolog.Add("status", ...)</text>
    <text x="636" y="252">unolog.Add("dur_ms", ...)</text>
    <text x="636" y="280">sampler.Decide(ev)</text>
    <text x="636" y="308">event complete</text>
  </g>

  <path d="M832 305h42" stroke="#7CFFB2" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M866 299l8 6-8 6" fill="none" stroke="#7CFFB2" stroke-opacity="0.8" stroke-width="1.5"/>

  <rect x="900" y="150" width="200" height="310" rx="14" fill="#10151C" stroke="#1B222B"/>
  <text x="916" y="184" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4"><tspan fill="#7CFFB2">04</tspan><tspan fill="#E6EBF1"> WRITE</tspan></text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="10.5">
    <text x="916" y="216" fill="#5B6472">{</text>
    <text x="930" y="240" fill="#E6EBF1">"msg": "request_done",</text>
    <text x="930" y="264" fill="#E6EBF1">"status": 200,</text>
    <text x="930" y="288" fill="#E6EBF1">"dur_ms": 12,</text>
    <text x="930" y="312" fill="#E6EBF1">"route": "/orders/:id",</text>
    <text x="930" y="336" fill="#E6EBF1">"req_id": "req_8f7a2b"</text>
    <text x="916" y="360" fill="#5B6472">}</text>
    <text x="916" y="400" fill="#7CFFB2">sink.Write(event)</text>
  </g>
</svg>
