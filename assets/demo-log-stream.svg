<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Log stream</title>
  <desc id="desc">Many incoming log lines collapse into one canonical unolog record.</desc>
  <rect width="1200" height="520" fill="#0A0C10"/>

  <text x="60" y="78" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#F4F6F8">Log stream</text>
  <text x="60" y="108" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8B94A1">Many lines in, one canonical record out.</text>

  <rect x="60" y="140" width="600" height="300" rx="14" fill="#10151C" stroke="#1B222B"/>
  <text x="84" y="178" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#6F7885">INCOMING</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="11">
    <text x="84" y="214" fill="#6F7885">03:14:24.156</text><text x="204" y="214" fill="#61AFEF">INFO</text><text x="286" y="214" fill="#C5CDD8">Request completed status=200 dur_ms=1247</text>
    <text x="84" y="244" fill="#6F7885">03:14:24.312</text><text x="204" y="244" fill="#E06C75">ERROR</text><text x="286" y="244" fill="#C5CDD8">Database pool exhausted active=20 waiting=14</text>
    <text x="84" y="274" fill="#6F7885">03:14:24.445</text><text x="204" y="274" fill="#E5C07B">WARN</text><text x="286" y="274" fill="#C5CDD8">Retrying HTTP request attempt=1 max=3</text>
    <text x="84" y="304" fill="#6F7885">03:14:25.112</text><text x="204" y="304" fill="#61AFEF">INFO</text><text x="286" y="304" fill="#C5CDD8">Circuit breaker open service=payment-api</text>
    <text x="84" y="334" fill="#6F7885">03:14:25.645</text><text x="204" y="334" fill="#56B6C2">DEBUG</text><text x="286" y="334" fill="#C5CDD8">Background job succeeded job_id=job_9x8w7v6u</text>
    <text x="84" y="364" fill="#6F7885">03:14:26.201</text><text x="204" y="364" fill="#E06C75">ERROR</text><text x="286" y="364" fill="#C5CDD8">Memory pressure critical heap=1.9GiB</text>
    <text x="84" y="394" fill="#6F7885">03:14:26.556</text><text x="204" y="394" fill="#E5C07B">WARN</text><text x="286" y="394" fill="#C5CDD8">Rate limit approaching user_id=user_abc123</text>
    <text x="84" y="424" fill="#6F7885">03:14:27.112</text><text x="204" y="424" fill="#61AFEF">INFO</text><text x="286" y="424" fill="#C5CDD8">WebSocket connected rooms=3</text>
  </g>

  <path d="M676 290h54" stroke="#7CFFB2" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M722 284l8 6-8 6" fill="none" stroke="#7CFFB2" stroke-opacity="0.8" stroke-width="1.5"/>

  <rect x="780" y="170" width="360" height="240" rx="14" fill="#10151C" stroke="#1B222B"/>
  <text x="804" y="208" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#7CFFB2">ONE EVENT</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="11">
    <text x="804" y="236" fill="#5B6472">{</text>
    <text x="818" y="260" fill="#8B94A1">"level":</text><text x="892" y="260" fill="#61AFEF">"INFO",</text>
    <text x="818" y="284" fill="#8B94A1">"msg":</text><text x="892" y="284" fill="#E6EBF1">"request_completed",</text>
    <text x="818" y="308" fill="#8B94A1">"route":</text><text x="892" y="308" fill="#E6EBF1">"/orders/{id}",</text>
    <text x="818" y="332" fill="#8B94A1">"status":</text><text x="892" y="332" fill="#7CFFB2">200</text><text x="916" y="332" fill="#5B6472">,</text>
    <text x="818" y="356" fill="#8B94A1">"dur_ms":</text><text x="892" y="356" fill="#7CFFB2">12</text><text x="910" y="356" fill="#5B6472">,</text>
    <text x="818" y="380" fill="#8B94A1">"request_id":</text><text x="892" y="380" fill="#E6EBF1">"req_8f7a2b3c"</text>
    <text x="804" y="404" fill="#5B6472">}</text>
  </g>
</svg>
